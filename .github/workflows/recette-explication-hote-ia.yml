name: Recette de explication-hote-ia

# La spécification explication-hote-ia contient son script, sa recette, son sous-agent et ses commandes.
# Le travail « recette » suit le chemin de l'IA du développeur, sous Linux et sous Windows : matérialiser
# la transmission courante, extraire les six fichiers par la commande du module execution, § 8, puis
# lancer la recette. Le travail « repères » confronte les repères du module modele-hote au Gemini CLI
# réel, à une version épinglée, contre une fausse API locale et un proxy témoin qui refuse toute autre
# sortie ; strace relève chaque connexion, et le travail échoue si l'une quitte la boucle locale.

on:
  pull_request:
    paths:
      - 'specs/explication-hote-ia/**'
      - 'transmissions/explication-hote-ia-*.md'
      - 'tools/bundle.mjs'
      - 'tools/installer.mjs'
      - '.github/scripts/reperes-hote.mjs'
      - '.github/workflows/recette-explication-hote-ia.yml'
  push:
    branches: [main]
    paths:
      - 'specs/explication-hote-ia/**'
      - 'transmissions/explication-hote-ia-*.md'
      - 'tools/bundle.mjs'
      - 'tools/installer.mjs'
      - '.github/scripts/reperes-hote.mjs'
      - '.github/workflows/recette-explication-hote-ia.yml'

permissions:
  contents: read

jobs:
  recette:
    name: recette (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Matérialiser la transmission courante, comme l'IA du développeur
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/materialiser.mjs" <<'FIN'
          import { createHash } from 'node:crypto';
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { dirname, join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const depot = process.env.GITHUB_WORKSPACE;
          // Sous Windows, actions/checkout extrait en CRLF : la transmission est relue en LF, comme elle a été écrite.
          const lire = (chemin) => readFileSync(join(depot, chemin), 'utf8').replace(/\r\n/g, '\n');
          const { relire } = await import(pathToFileURL(join(depot, 'tools', 'bundle.mjs')).href);
          const { version } = JSON.parse(lire('specs/explication-hote-ia/manifest.json'));
          const { fichiers, sommes } = relire(lire(`transmissions/explication-hote-ia-${version}.md`));
          const cible = join(process.env.RUNNER_TEMP, 'explication-hote-ia');
          for (const f of fichiers) {
            mkdirSync(dirname(join(cible, f.rel)), { recursive: true });
            writeFileSync(join(cible, f.rel), f.contenu);
          }
          const attendues = new Map(sommes.map((s) => [s.rel, s.empreinte]));
          const ecarts = fichiers.filter((f) => createHash('sha256').update(readFileSync(join(cible, f.rel))).digest('hex') !== attendues.get(f.rel));
          for (const f of ecarts) console.log(`::error title=Intégrité de la transmission::${f.rel}`);
          const execution = readFileSync(join(cible, 'modules/execution/SKILL.md'), 'utf8');
          const section = execution.split('## 8. Matérialiser les fichiers exécutables')[1]?.split('\n## 9.')[0] ?? '';
          const commande = /```text\n(node -e .+)\n```/.exec(section)?.[1];
          if (!commande) {
            console.log('::error title=Extraction::commande introuvable dans le module execution, § 8');
            process.exit(1);
          }
          writeFileSync(join(cible, 'extraire.sh'), `${commande}\n`);
          writeFileSync(join(cible, 'extraire.cmd'), `@echo off\r\n${commande}\r\nif errorlevel 1 exit /b 1\r\n`);
          console.log(`explication-hote-ia ${version} : ${fichiers.length} fichiers matérialisés dans ${cible}`);
          if (ecarts.length > 0) process.exit(1);
          FIN
          cat > "$RUNNER_TEMP/annoter.mjs" <<'FIN'
          import { readFileSync } from 'node:fs';
          // Bilan et échecs de la recette (sortie TAP de node --test) en annotations de la pull request.
          const [fichier, libelle] = process.argv.slice(2);
          const texte = readFileSync(fichier, 'utf8').replace(/\r\n/g, '\n');
          const donnee = (s) => s.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
          const propriete = (s) => donnee(s).replace(/:/g, '%3A').replace(/,/g, '%2C');
          const lignes = texte.split('\n');
          lignes.forEach((ligne, i) => {
            const echec = /^not ok \d+ - (.*)$/.exec(ligne);
            if (!echec) return;
            const bloc = [];
            for (let j = i + 1; j < lignes.length && !/^\s*\.\.\.$/.test(lignes[j]); j++) bloc.push(lignes[j]);
            const utiles = bloc.filter((l) => /^\s+(error|expected|actual|location):/.test(l) || /^\s{4,}\S/.test(l));
            const message = utiles.map((l) => l.trim()).join('\n').slice(0, 3000) || 'échec sans diagnostic';
            console.log(`::error title=${propriete(`Recette ${libelle} : ${echec[1]}`)}::${donnee(message)}`);
          });
          const compte = (cle) => Number(new RegExp(`^# ${cle} (\\d+)$`, 'm').exec(texte)?.[1] ?? 0);
          console.log(`::notice title=${propriete(`Recette ${libelle}`)}::${compte('tests')} tests, ${compte('pass')} réussis, ${compte('skipped')} sautés, ${compte('fail')} échecs`);
          FIN
          node "$RUNNER_TEMP/materialiser.mjs"

      - name: Extraire les six fichiers sous bash
        if: runner.os != 'Windows'
        shell: bash
        working-directory: ${{ runner.temp }}/explication-hote-ia
        run: bash extraire.sh

      - name: Extraire les six fichiers sous CMD
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: ${{ runner.temp }}\explication-hote-ia
        run: call extraire.cmd

      - name: Recette sous bash
        if: runner.os != 'Windows'
        shell: bash
        working-directory: ${{ runner.temp }}/explication-hote-ia
        run: |
          node --version
          node scripts/instantane-hote.mjs hote --format texte || true
          statut=0
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=recette.tap tests/instantane-hote.test.mjs || statut=$?
          node "$RUNNER_TEMP/annoter.mjs" recette.tap "${{ runner.os }}, Node ${{ matrix.node }}"
          exit $statut

      - name: Recette sous CMD
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: ${{ runner.temp }}\explication-hote-ia
        run: |
          node --version
          node scripts\instantane-hote.mjs hote --format texte
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=recette.tap tests/instantane-hote.test.mjs
          set statut=%errorlevel%
          node "%RUNNER_TEMP%\annoter.mjs" recette.tap "${{ runner.os }}, Node ${{ matrix.node }}"
          exit /b %statut%

  reperes:
    name: repères contre Gemini CLI (@google/gemini-cli 0.67.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Paquet de Gemini CLI, à la version épinglée, et strace
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gemini"
          cd "$RUNNER_TEMP/gemini"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --ignore-scripts @google/gemini-cli@0.67.0
          command -v strace > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q strace; }
          command -v script git

      - name: Repères, chaque connexion relevée
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/connexions.mjs" <<'FIN'
          import { readFileSync } from 'node:fs';
          // Relit le journal strace (-e trace=connect) : chaque connexion IPv4 ou IPv6 doit viser la boucle locale.
          const lignes = readFileSync(process.argv[2], 'utf8').split('\n').filter((l) => /connect\(\d+, \{sa_family=AF_INET6?\b/.test(l));
          const locale = (l) => /inet_addr\("127\.\d+\.\d+\.\d+"\)/.test(l) || /inet_pton\(AF_INET6, "(::1|::ffff:127\.\d+\.\d+\.\d+)"/.test(l);
          const hors = lignes.filter((l) => !locale(l));
          for (const l of hors) console.log(`::error title=Connexion hors de la boucle locale::${l.replace(/^\d+\s+/, '').slice(0, 300)}`);
          console.log(`::notice title=Connexions des repères::${lignes.length} connexion(s) IPv4 ou IPv6, ${hors.length} hors de la boucle locale`);
          process.exitCode = hors.length === 0 && lignes.length > 0 ? 0 : 1;
          FIN
          statut=0
          strace -f -qq -e trace=connect -o "$RUNNER_TEMP/connexions.log" \
            node .github/scripts/reperes-hote.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/gemini/node_modules/@google/gemini-cli" || statut=$?
          node "$RUNNER_TEMP/connexions.mjs" "$RUNNER_TEMP/connexions.log" || statut=1
          exit $statut
