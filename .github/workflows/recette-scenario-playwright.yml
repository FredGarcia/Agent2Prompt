name: Recette de scenario-playwright

# La spécification scenario-playwright contient ses scripts, sa recette, son agent et ses commandes. Ce workflow suit
# le chemin de l'IA du développeur, sous Linux et sous Windows : matérialiser la transmission courante, extraire les
# fichiers par la commande du module execution, § 8, installer la dépendance par npm ci, puis lancer la recette
# contre l'application de démonstration locale, avec le Chrome stable des images GitHub (sous écran virtuel pour Linux).
# La sortie de la recette s'affiche au fil de l'eau ; un pas bloqué s'arrête au bout de douze minutes. Une recette en
# échec laisse son dossier temporaire en artefact, sans les profils du navigateur : rapports, captures, instantanés
# ARIA et sortie de la recette, pour examiner l'échec sans le reproduire.

on:
  pull_request:
    paths:
      - 'specs/scenario-playwright/**'
      - 'transmissions/scenario-playwright-*.md'
      - 'tools/bundle.mjs'
      - '.github/workflows/recette-scenario-playwright.yml'
  push:
    branches: [main]
    paths:
      - 'specs/scenario-playwright/**'
      - 'transmissions/scenario-playwright-*.md'
      - 'tools/bundle.mjs'
      - '.github/workflows/recette-scenario-playwright.yml'

permissions:
  contents: read

jobs:
  recette:
    name: recette (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24, '26.13.0']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Matérialiser la transmission courante, comme l'IA du développeur
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/materialiser.mjs" <<'FIN'
          import { createHash } from 'node:crypto';
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { dirname, join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const depot = process.env.GITHUB_WORKSPACE;
          // Sous Windows, actions/checkout extrait en CRLF : la transmission est relue en LF, comme elle a été écrite.
          const lire = (chemin) => readFileSync(join(depot, chemin), 'utf8').replace(/\r\n/g, '\n');
          const { relire } = await import(pathToFileURL(join(depot, 'tools', 'bundle.mjs')).href);
          const { version } = JSON.parse(lire('specs/scenario-playwright/manifest.json'));
          const { fichiers, sommes } = relire(lire(`transmissions/scenario-playwright-${version}.md`));
          const cible = join(process.env.RUNNER_TEMP, 'scenario-playwright');
          for (const f of fichiers) {
            mkdirSync(dirname(join(cible, f.rel)), { recursive: true });
            writeFileSync(join(cible, f.rel), f.contenu);
          }
          const attendues = new Map(sommes.map((s) => [s.rel, s.empreinte]));
          const ecarts = fichiers.filter((f) => createHash('sha256').update(readFileSync(join(cible, f.rel))).digest('hex') !== attendues.get(f.rel));
          for (const f of ecarts) console.log(`::error title=Intégrité de la transmission::${f.rel}`);
          const execution = readFileSync(join(cible, 'modules/execution/SKILL.md'), 'utf8');
          const section = execution.split('## 8. Matérialiser les fichiers exécutables')[1]?.split('\n## 9.')[0] ?? '';
          const commande = /```text\n(node -e .+)\n```/.exec(section)?.[1];
          if (!commande) {
            console.log('::error title=Extraction::commande introuvable dans le module execution, § 8');
            process.exit(1);
          }
          writeFileSync(join(cible, 'extraire.sh'), `${commande}\n`);
          writeFileSync(join(cible, 'extraire.cmd'), `@echo off\r\n${commande}\r\nif errorlevel 1 exit /b 1\r\n`);
          console.log(`scenario-playwright ${version} : ${fichiers.length} fichiers matérialisés dans ${cible}`);
          if (ecarts.length > 0) process.exit(1);
          FIN
          cat > "$RUNNER_TEMP/annoter.mjs" <<'FIN'
          import { readFileSync } from 'node:fs';
          // Bilan et échecs de la recette (lignes « KO Rn · … ») en annotations de la pull request.
          const [fichier, libelle] = process.argv.slice(2);
          const texte = readFileSync(fichier, 'utf8').replace(/\r\n/g, '\n');
          const donnee = (s) => s.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
          const propriete = (s) => donnee(s).replace(/:/g, '%3A').replace(/,/g, '%2C');
          for (const ligne of texte.split('\n')) {
            const ko = /^KO\s+(R\d+) · (.*)$/.exec(ligne);
            if (ko) console.log(`::error title=${propriete(`Recette ${libelle} : ${ko[1]}`)}::${donnee(ko[2].slice(0, 3000))}`);
          }
          const bilan = /^Bilan : .*$/m.exec(texte)?.[0] ?? 'bilan absent';
          console.log(`::notice title=${propriete(`Recette ${libelle}`)}::${donnee(bilan)}`);
          FIN
          cat > "$RUNNER_TEMP/garder.mjs" <<'FIN'
          import { cpSync, mkdirSync, readFileSync } from 'node:fs';
          import { basename, join } from 'node:path';
          // Dossier temporaire gardé par une recette en échec, copié sans les profils du navigateur, avec la sortie.
          const [fichier, cible] = process.argv.slice(2);
          const texte = readFileSync(fichier, 'utf8').replace(/\r\n/g, '\n');
          // Le dossier est dit gardé en fin de recette ; une recette arrêtée par le délai du pas ne l'a dit qu'au début.
          const garde = (/^Dossier temporaire gardé : (.+)$/m.exec(texte) ?? /^Dossier temporaire : (.+)$/m.exec(texte))?.[1]?.trim();
          mkdirSync(cible, { recursive: true });
          cpSync(fichier, join(cible, 'recette.txt'));
          try {
            if (garde) cpSync(garde, join(cible, basename(garde)), { recursive: true, filter: (s) => !/[\\/]profils([\\/]|$)/.test(s.slice(garde.length)) });
          } catch (e) {
            console.log(`copie partielle : ${e.message}`);
          }
          console.log(garde ? `dossier gardé : ${garde}` : 'aucun dossier temporaire dans la sortie');
          FIN
          node "$RUNNER_TEMP/materialiser.mjs"

      - name: Extraire les scripts, la recette, l'agent et les commandes sous bash
        if: runner.os != 'Windows'
        shell: bash
        working-directory: ${{ runner.temp }}/scenario-playwright
        run: bash extraire.sh

      - name: Extraire les scripts, la recette, l'agent et les commandes sous CMD
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: ${{ runner.temp }}\scenario-playwright
        run: call extraire.cmd

      - name: Installer la dépendance
        shell: bash
        working-directory: ${{ runner.temp }}/scenario-playwright
        run: npm ci

      - name: Recette sous Linux, écran virtuel
        if: runner.os != 'Windows'
        shell: bash
        timeout-minutes: 12
        working-directory: ${{ runner.temp }}/scenario-playwright
        run: |
          set -o pipefail
          node --version
          google-chrome --version || true
          xvfb-run -a npm test 2>&1 | tee recette.txt

      - name: Recette sous Windows
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 12
        working-directory: ${{ runner.temp }}/scenario-playwright
        run: |
          set -o pipefail
          node --version
          npm test 2>&1 | tee recette.txt

      - name: Bilan en annotations
        if: always()
        shell: bash
        working-directory: ${{ runner.temp }}/scenario-playwright
        run: if [ -f recette.txt ]; then node "$RUNNER_TEMP/annoter.mjs" recette.txt "${{ runner.os }}, Node ${{ matrix.node }}"; fi

      - name: Rassembler les preuves d'une recette en échec
        if: failure()
        shell: bash
        working-directory: ${{ runner.temp }}/scenario-playwright
        run: if [ -f recette.txt ]; then node "$RUNNER_TEMP/garder.mjs" recette.txt "$RUNNER_TEMP/recette-gardee"; fi

      - name: Garder les preuves d'une recette en échec
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: recette-${{ runner.os }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/recette-gardee
          if-no-files-found: ignore
          retention-days: 7
