name: Recette de l'installateur

# tools/installer.mjs installe un skill dans Gemini CLI à partir de sa transmission ; installer.mjs, à la
# racine du dépôt, installe ou met à jour tous les skills et les agents de leurs modules. Leurs recettes
# tournent sous Linux et sous Windows. Le job « contrat » confronte leurs installations au code de Gemini
# CLI lui-même, à une version épinglée : découverte des skills, lecture de chacun de leurs fichiers,
# chargement des sous-agents, et historique du dépôt caché par son .geminiignore.

on:
  pull_request:
    paths:
      - 'installer.mjs'
      - 'installer.cmd'
      - '.geminiignore'
      - 'tools/**'
      - 'transmissions/**'
      - '.github/scripts/contrat-gemini.mjs'
      - '.github/workflows/recette-installer.yml'
  push:
    branches: [main]
    paths:
      - 'installer.mjs'
      - 'installer.cmd'
      - '.geminiignore'
      - 'tools/**'
      - 'transmissions/**'
      - '.github/scripts/contrat-gemini.mjs'
      - '.github/workflows/recette-installer.yml'

permissions:
  contents: read

jobs:
  recette:
    name: recette (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 24, '26.13.0']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Recette de tools/installer.mjs et de installer.mjs
        run: node --test tools/installer.test.mjs tools/installer-racine.test.mjs

  contrat:
    name: contrat avec Gemini CLI (@google/gemini-cli-core 0.66.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26.13.0'
      - name: Paquet de Gemini CLI, à la version épinglée
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gemini"
          cd "$RUNNER_TEMP/gemini"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --ignore-scripts @google/gemini-cli-core@0.66.0
          cp "$GITHUB_WORKSPACE/.github/scripts/contrat-gemini.mjs" .
      - name: Installer tous les skills et les agents, puis les relire et les charger avec le code de Gemini CLI
        shell: bash
        run: node "$RUNNER_TEMP/gemini/contrat-gemini.mjs" "$GITHUB_WORKSPACE"
