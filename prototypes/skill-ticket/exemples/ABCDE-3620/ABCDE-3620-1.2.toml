ecriture = { reponse = "non", source = "décomposition de ABCDE-3620-1" }
endpoint_nouveau = { reponse = "non", source = "parent : ABCDE-3620" }
endpoint_modifie = { reponse = "oui", precision = "GET /api/v1/commandes/{id}, paramètre vue ; GET /api/v1/commandes/{id}/lignes, en-tête ETag", source = "décomposition de ABCDE-3620-1" }
variante_representation = { reponse = "oui", precision = "champ lignes, une liste de records", source = "décomposition de ABCDE-3620-1" }
temps_reel = { reponse = "oui", precision = "canal des lignes, date-heure recalculée dans chaque événement", source = "décomposition de ABCDE-3620-1" }
